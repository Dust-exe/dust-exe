<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; } 45% { opacity: 0.15; } }
      @keyframes twinkleC { 0%, 100% { opacity: 0.25; } 65% { opacity: 1.00; } }
      @keyframes twinkleD { 0%, 100% { opacity: 0.90; } 55% { opacity: 0.10; } }
      @keyframes twinkleE { 0%, 100% { opacity: 0.20; } 75% { opacity: 0.90; } }
      @keyframes twinkleF { 0%, 100% { opacity: 0.80; } 35% { opacity: 0.20; } }

      .star-a { animation: twinkleA 2.1s infinite ease-in-out 0.0s; }
      .star-b { animation: twinkleB 3.3s infinite ease-in-out 0.5s; }
      .star-c { animation: twinkleC 1.7s infinite ease-in-out 1.1s; }
      .star-d { animation: twinkleD 2.8s infinite ease-in-out 0.3s; }
      .star-e { animation: twinkleE 3.9s infinite ease-in-out 1.5s; }
      .star-f { animation: twinkleF 2.4s infinite ease-in-out 0.8s; }
    </style>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060210" />
      <stop offset="35%" stop-color="#15072d" />
      <stop offset="50%" stop-color="#24063c" />
      <stop offset="65%" stop-color="#15072d" />
      <stop offset="100%" stop-color="#060210" />
    </linearGradient>
    <linearGradient id="gBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="44" rx="10" fill="url(#gBg)" stroke="url(#gBorder)" stroke-width="1.2" />
  
  <g fill="#ffffff">
    <circle class="star-b" cx="731" cy="37" r="0.7" opacity="0.73" />
    <circle class="star-c" cx="630" cy="31" r="0.7" opacity="0.81" />
    <circle class="star-a" cx="294" cy="24" r="0.7" opacity="0.53" />
    <circle class="star-d" cx="63" cy="13" r="1.1" opacity="0.75" />
    <circle class="star-e" cx="576" cy="30" r="0.7" opacity="0.67" />
    <circle class="star-f" cx="147" cy="28" r="0.7" opacity="0.78" />
  </g>

  <text x="450" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="url(#gText)" text-anchor="middle" letter-spacing="3.5">ENGINEERING METRICS &amp; ANALYTICS</text>
</svg>