<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; } 45% { opacity: 0.15; } }
      @keyframes twinkleC { 0%, 100% { opacity: 0.25; } 65% { opacity: 1.00; } }
      @keyframes twinkleD { 0%, 100% { opacity: 0.90; } 55% { opacity: 0.10; } }
      @keyframes twinkleE { 0%, 100% { opacity: 0.20; } 75% { opacity: 0.90; } }
      @keyframes twinkleF { 0%, 100% { opacity: 0.80; } 35% { opacity: 0.20; } }

      .star-a { animation: twinkleA 2.1s infinite ease-in-out 0.0s; }
      .star-b { animation: twinkleB 3.3s infinite ease-in-out 0.5s; }
      .star-c { animation: twinkleC 1.7s infinite ease-in-out 1.1s; }
      .star-d { animation: twinkleD 2.8s infinite ease-in-out 0.3s; }
      .star-e { animation: twinkleE 3.9s infinite ease-in-out 1.5s; }
      .star-f { animation: twinkleF 2.4s infinite ease-in-out 0.8s; }
    </style>
    <linearGradient id="tblBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="50%" stop-color="#140728" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>

    <linearGradient id="tblHeaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e0b38" />
      <stop offset="50%" stop-color="#2d0a4e" />
      <stop offset="100%" stop-color="#1e0b38" />
    </linearGradient>

    <linearGradient id="tblBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="286" rx="14" fill="url(#tblBg)" stroke="url(#tblBorder)" stroke-width="1.5" />

  <g fill="#ffffff">
    <circle class="star-a" cx="140" cy="80" r="1.1" opacity="0.6" />
    <circle class="star-b" cx="750" cy="220" r="1.4" opacity="0.7" />
  </g>

  <!-- Header Row -->
  <path d="M 2 16 A 14 14 0 0 1 16 2 L 884 2 A 14 14 0 0 1 898 16 L 898 46 L 2 46 Z" fill="url(#tblHeaderBg)" />
  <line x1="2" y1="46" x2="898" y2="46" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Header Labels -->
  <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#f5d0fe" letter-spacing="1.5">ENGINEERING DOMAIN</text>
  <text x="260" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#f5d0fe" letter-spacing="1.5">TECHNOLOGIES &amp; FRAMEWORKS</text>

  <line x1="230" y1="2" x2="230" y2="286" stroke="#c084fc" stroke-width="1" stroke-opacity="0.25" />

  <!-- Row 1: Languages -->
  <line x1="2" y1="94" x2="898" y2="94" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Languages</text>
  <text x="260" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">Python, TypeScript, C#, JavaScript, SQL, Bash/Shell</text>

  <!-- Row 2: Backend & Microservices -->
  <line x1="2" y1="142" x2="898" y2="142" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Backend &amp; APIs</text>
  <text x="260" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">FastAPI, Node.js, Express, Async SQLAlchemy, Pydantic, REST APIs, OAuth2</text>

  <!-- Row 3: Data & Storage -->
  <line x1="2" y1="190" x2="898" y2="190" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Data &amp; Persistence</text>
  <text x="260" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">PostgreSQL, Redis Caching, SQLite (WAL Mode), Alembic Migrations</text>

  <!-- Row 4: Frontend & UI -->
  <line x1="2" y1="238" x2="898" y2="238" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Frontend &amp; UI</text>
  <text x="260" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">React 18, TypeScript, Vite, TailwindCSS, Framer Motion, Responsive SPA</text>

  <!-- Row 5: DevOps & Infrastructure -->
  <text x="24" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">DevOps &amp; Infra</text>
  <text x="260" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">Docker Compose, Nginx, Linux VDS Administration, Systemd, GitHub Actions, WireGuard</text>
</svg>