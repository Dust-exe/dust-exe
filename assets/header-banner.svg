<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; } 45% { opacity: 0.15; } }
      @keyframes twinkleC { 0%, 100% { opacity: 0.25; } 65% { opacity: 1.00; } }
      @keyframes twinkleD { 0%, 100% { opacity: 0.90; } 55% { opacity: 0.10; } }
      @keyframes twinkleE { 0%, 100% { opacity: 0.20; } 75% { opacity: 0.90; } }
      @keyframes twinkleF { 0%, 100% { opacity: 0.80; } 35% { opacity: 0.20; } }
      @keyframes nebulaDrift { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.45; } }

      .star-a { animation: twinkleA 2.1s infinite ease-in-out 0.0s; }
      .star-b { animation: twinkleB 3.3s infinite ease-in-out 0.5s; }
      .star-c { animation: twinkleC 1.7s infinite ease-in-out 1.1s; }
      .star-d { animation: twinkleD 2.8s infinite ease-in-out 0.3s; }
      .star-e { animation: twinkleE 3.9s infinite ease-in-out 1.5s; }
      .star-f { animation: twinkleF 2.4s infinite ease-in-out 0.8s; }
      .nebula { animation: nebulaDrift 8s infinite ease-in-out; }
    </style>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020c" />
      <stop offset="40%" stop-color="#12062b" />
      <stop offset="75%" stop-color="#240742" />
      <stop offset="100%" stop-color="#080214" />
    </linearGradient>

    <radialGradient id="nebula1" cx="25%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula2" cx="80%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#5b21b6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cosmicBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="186" rx="16" fill="url(#spaceGrad)" stroke="url(#cosmicBorder)" stroke-width="1.8" />
  <rect class="nebula" x="2" y="2" width="896" height="186" rx="16" fill="url(#nebula1)" />
  <rect class="nebula" x="2" y="2" width="896" height="186" rx="16" fill="url(#nebula2)" />

  <g fill="#ffffff">
    <circle class="star-a" cx="120" cy="40" r="1.2" opacity="0.8" />
    <circle class="star-b" cx="240" cy="110" r="1.5" opacity="0.7" />
    <circle class="star-c" cx="380" cy="30" r="1.0" opacity="0.6" />
    <circle class="star-d" cx="440" cy="85" r="1.4" opacity="0.9" />
    <circle class="star-e" cx="560" cy="140" r="1.1" opacity="0.75" />
    <circle class="star-f" cx="680" cy="45" r="1.6" opacity="0.85" />
    <circle class="star-a" cx="760" cy="120" r="1.2" opacity="0.65" />
    <circle class="star-b" cx="840" cy="35" r="1.3" opacity="0.9" />
    <circle class="star-c" cx="60" cy="150" r="1.1" opacity="0.5" />
    <circle class="star-d" cx="300" cy="160" r="1.4" opacity="0.7" />
  </g>

  <!-- Title & Subtitle -->
  <text x="450" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="46" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="3">dust.exe</text>
  <text x="450" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" font-size="14" fill="#c4b5fd" text-anchor="middle" letter-spacing="4.5">SYSTEM ARCHITECT &amp; FULL-STACK ENGINEER</text>

  <line x1="200" y1="136" x2="700" y2="136" stroke="url(#cosmicBorder)" stroke-width="1.2" stroke-opacity="0.7" />
  <text x="450" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="600" font-size="11" fill="#f0abfc" text-anchor="middle" letter-spacing="3">PYTHON  •  TYPESCRIPT  •  C#  •  FASTAPI  •  POSTGRESQL  •  DOCKER  •  LINUX</text>
</svg>