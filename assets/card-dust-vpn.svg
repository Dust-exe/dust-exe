<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 135" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.15); } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; transform: scale(1.1); } 40% { opacity: 0.2; transform: scale(0.75); } }

      .star-a { animation: twinkleA 3.4s infinite ease-in-out; }
      .star-b { animation: twinkleB 2.6s infinite ease-in-out 0.4s; }
    </style>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#14062a" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <linearGradient id="vBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="131" rx="14" fill="url(#vBg)" stroke="url(#vBorder)" stroke-width="1.4" />

  <g fill="#ffffff">
    <circle class="star-a" cx="200" cy="40" r="1.1" opacity="0.6" />
    <circle class="star-b" cx="700" cy="90" r="1.4" opacity="0.7" />
  </g>

  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" fill="#f5d0fe">Dust-vpn — <tspan font-weight="400" font-style="italic" font-size="13.5" fill="#c4b5fd">Open-Source Windows VPN Client &amp; Obfuscation Engine</tspan></text>
  <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#e9d5ff">Custom Windows desktop application for WireGuard &amp; AmneziaWG server management with packet obfuscation &amp; dust:// handler.</text>

  <rect x="30" y="78" width="840" height="38" rx="7" fill="#1c0a36" stroke="#c084fc" stroke-opacity="0.4" />
  <text x="44" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Core Stack &amp; Architecture:</text>
  <text x="195" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">Python, WireGuard Core API, AmneziaWG Engine, Custom Packet Obfuscation, Windows API Integration</text>
</svg>