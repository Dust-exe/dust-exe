<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; } 45% { opacity: 0.15; } }
      @keyframes twinkleC { 0%, 100% { opacity: 0.25; } 65% { opacity: 1.00; } }
      @keyframes twinkleD { 0%, 100% { opacity: 0.90; } 55% { opacity: 0.10; } }
      @keyframes twinkleE { 0%, 100% { opacity: 0.20; } 75% { opacity: 0.90; } }
      @keyframes twinkleF { 0%, 100% { opacity: 0.80; } 35% { opacity: 0.20; } }
      @keyframes nebulaDrift { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.45; } }

      .star-a { animation: twinkleA 2.1s infinite ease-in-out 0.0s; }
      .star-b { animation: twinkleB 3.3s infinite ease-in-out 0.5s; }
      .star-c { animation: twinkleC 1.7s infinite ease-in-out 1.1s; }
      .star-d { animation: twinkleD 2.8s infinite ease-in-out 0.3s; }
      .star-e { animation: twinkleE 3.9s infinite ease-in-out 1.5s; }
      .star-f { animation: twinkleF 2.4s infinite ease-in-out 0.8s; }
      .nebula { animation: nebulaDrift 8s infinite ease-in-out; }
    </style>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#14062a" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <radialGradient id="cNebula" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="226" rx="14" fill="url(#cBg)" stroke="url(#cBorder)" stroke-width="1.4" />
  <rect class="nebula" x="2" y="2" width="896" height="226" rx="14" fill="url(#cNebula)" />

  <g fill="#ffffff">
    <circle class="star-a" cx="120" cy="50" r="1.1" opacity="0.6" />
    <circle class="star-b" cx="340" cy="180" r="1.4" opacity="0.7" />
    <circle class="star-c" cx="560" cy="40" r="1.0" opacity="0.5" />
    <circle class="star-d" cx="820" cy="160" r="1.3" opacity="0.8" />
  </g>

  <!-- Executive Summary Text -->
  <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#e9d5ff">As a System Architect and Full-Stack Engineer, I specialize in architecting distributed backend services, high-throughput</text>
  <text x="30" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#e9d5ff">microservices, containerized deployments, and robust Linux / VDS infrastructure supervision.</text>

  <!-- Bullet 1 -->
  <circle cx="38" cy="99" r="3.5" fill="#c084fc" />
  <text x="54" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#f5d0fe">Architectural Strategy:</text>
  <text x="212" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#f5f3ff">Decoupled edge clients as interfaces; state &amp; logic in FastAPI + PostgreSQL backend services.</text>

  <!-- Bullet 2 -->
  <circle cx="38" cy="139" r="3.5" fill="#c084fc" />
  <text x="54" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#f5d0fe">Infrastructure &amp; VDS Management:</text>
  <text x="288" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#f5f3ff">Linux environment, Docker Compose orchestration, Nginx reverse proxy &amp; zero-downtime operations.</text>

  <!-- Bullet 3 -->
  <circle cx="38" cy="179" r="3.5" fill="#c084fc" />
  <text x="54" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#f5d0fe">Security &amp; Performance:</text>
  <text x="238" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#f5f3ff">OAuth2 session safety, Redis caching layer, SQLite WAL edge persistence &amp; custom protocol handlers.</text>
</svg>