<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="100%">
  <defs>
        <style>
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes floatGlow {
        0%, 100% { opacity: 0.25; transform: translate(0, 0); }
        50% { opacity: 0.55; transform: translate(15px, -10px); }
      }
      @keyframes shimmerBorder {
        0% { stop-color: #4c1d95; }
        50% { stop-color: #d946ef; }
        100% { stop-color: #4c1d95; }
      }
      .star1 { animation: starPulse 3s infinite ease-in-out; }
      .star2 { animation: starPulse 2.2s infinite ease-in-out 0.7s; }
      .star3 { animation: starPulse 4s infinite ease-in-out 1.4s; }
      .nebula { animation: floatGlow 8s infinite ease-in-out; }
    </style>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060210" />
      <stop offset="35%" stop-color="#15072d" />
      <stop offset="50%" stop-color="#24063c" />
      <stop offset="65%" stop-color="#15072d" />
      <stop offset="100%" stop-color="#060210" />
    </linearGradient>
    <linearGradient id="gBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="44" rx="10" fill="url(#gBg)" stroke="url(#gBorder)" stroke-width="1.2" />
  
  <!-- Twinkling Stars -->
  <circle class="star1" cx="40" cy="24" r="1.2" fill="#fff" opacity="0.8" />
  <circle class="star2" cx="110" cy="14" r="1" fill="#fff" opacity="0.6" />
  <circle class="star3" cx="790" cy="34" r="1.2" fill="#fff" opacity="0.8" />
  <circle class="star1" cx="850" cy="18" r="1" fill="#fff" opacity="0.6" />

  <text x="450" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="url(#gText)" text-anchor="middle" letter-spacing="3.5">EXECUTIVE SUMMARY &amp; ARCHITECTURE</text>
</svg>