<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
        <style>
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes floatGlow {
        0%, 100% { opacity: 0.25; transform: translate(0, 0); }
        50% { opacity: 0.55; transform: translate(15px, -10px); }
      }
      @keyframes shimmerBorder {
        0% { stop-color: #4c1d95; }
        50% { stop-color: #d946ef; }
        100% { stop-color: #4c1d95; }
      }
      .star1 { animation: starPulse 3s infinite ease-in-out; }
      .star2 { animation: starPulse 2.2s infinite ease-in-out 0.7s; }
      .star3 { animation: starPulse 4s infinite ease-in-out 1.4s; }
      .nebula { animation: floatGlow 8s infinite ease-in-out; }
    </style>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#14062a" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <linearGradient id="vBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="126" rx="14" fill="url(#vBg)" stroke="url(#vBorder)" stroke-width="1.2" />

  <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" fill="#f5d0fe">Dust-vpn - <tspan font-weight="400" font-style="italic" font-size="13.5" fill="#c4b5fd">Open-Source Windows VPN Client</tspan></text>
  <text x="30" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#e9d5ff">Desktop client for WireGuard &amp; AmneziaWG custom server management with packet obfuscation &amp; dust:// handler.</text>

  <rect x="30" y="74" width="840" height="34" rx="6" fill="#1c0a36" stroke="#a855f7" stroke-opacity="0.3" />
  <text x="44" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Core Stack &amp; Features:</text>
  <text x="185" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">Python, WireGuard Engine, AmneziaWG Core, Packet Obfuscation, Windows APIs</text>
</svg>