<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0718" />
      <stop offset="30%" stop-color="#180933" />
      <stop offset="50%" stop-color="#260840" />
      <stop offset="70%" stop-color="#180933" />
      <stop offset="100%" stop-color="#0b0718" />
    </linearGradient>
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="bannerText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="50%" stop-color="#f0abfc" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="60" rx="12" fill="url(#bannerBg)" stroke="url(#bannerBorder)" stroke-width="1.5" />
  
  <!-- Subtle Center Glow -->
  <ellipse cx="450" cy="32" rx="280" ry="24" fill="#7c3aed" fill-opacity="0.08" />

  <!-- Side Accent Lines -->
  <line x1="30" y1="32" x2="180" y2="32" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <line x1="720" y1="32" x2="870" y2="32" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />

  <!-- Banner Title Text -->
  <text x="450" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="url(#bannerText)" text-anchor="middle" letter-spacing="4">OPEN-SOURCE ENGINEERING</text>
</svg>