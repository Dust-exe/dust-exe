<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
        <style>
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes floatGlow {
        0%, 100% { opacity: 0.25; transform: translate(0, 0); }
        50% { opacity: 0.55; transform: translate(15px, -10px); }
      }
      @keyframes shimmerBorder {
        0% { stop-color: #4c1d95; }
        50% { stop-color: #d946ef; }
        100% { stop-color: #4c1d95; }
      }
      .star1 { animation: starPulse 3s infinite ease-in-out; }
      .star2 { animation: starPulse 2.2s infinite ease-in-out 0.7s; }
      .star3 { animation: starPulse 4s infinite ease-in-out 1.4s; }
      .nebula { animation: floatGlow 8s infinite ease-in-out; }
    </style>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#120626" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <radialGradient id="cNebula" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="226" rx="14" fill="url(#cBg)" stroke="url(#cBorder)" stroke-width="1.2" />
  <rect class="nebula" x="2" y="2" width="896" height="226" rx="14" fill="url(#cNebula)" />

  <g fill="#ffffff">
    <circle class="star1" cx="60" cy="40" r="1" />
    <circle class="star2" cx="220" cy="180" r="1.3" />
    <circle class="star3" cx="740" cy="50" r="1" />
    <circle class="star1" cx="830" cy="170" r="1.2" />
  </g>

  <!-- Content Lines -->
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#e9d5ff">As a System Architect and Full-Stack Engineer, I specialize in architecting distributed backend services, high-throughput</text>
  <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#e9d5ff">microservices, containerized deployments, and automated release pipelines.</text>

  <!-- Bullet 1 -->
  <circle cx="38" cy="95" r="3" fill="#c084fc" />
  <text x="52" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#f5d0fe">Architectural Strategy:</text>
  <text x="210" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#f5f3ff">Decoupled edge clients act as interfaces. Logic &amp; state reside in authoritative FastAPI + PostgreSQL services.</text>

  <!-- Bullet 2 -->
  <circle cx="38" cy="135" r="3" fill="#c084fc" />
  <text x="52" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#f5d0fe">Infrastructure &amp; VDS Management:</text>
  <text x="285" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#f5f3ff">Linux infrastructure, Docker Compose, Nginx, systemd supervision &amp; zero-downtime.</text>

  <!-- Bullet 3 -->
  <circle cx="38" cy="175" r="3" fill="#c084fc" />
  <text x="52" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#f5d0fe">Security &amp; Performance:</text>
  <text x="235" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#f5f3ff">OAuth2, Redis caching, SQLite WAL mode edge storage, custom protocols &amp; obfuscation.</text>
</svg>