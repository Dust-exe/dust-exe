<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0718" />
      <stop offset="40%" stop-color="#1c0a36" />
      <stop offset="70%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#090414" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0abfc" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="196" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <path d="M 0 40 Q 450 90 900 40" fill="none" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="1.5" />
  <path d="M 0 160 Q 450 110 900 160" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1.5" />
  <circle cx="450" cy="100" r="140" fill="#7c3aed" fill-opacity="0.05" filter="url(#glow)" />

  <!-- Text Header -->
  <text x="450" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">dust.exe</text>
  
  <!-- Subtitle -->
  <text x="450" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#c4b5fd" text-anchor="middle" letter-spacing="5">SYSTEM ARCHITECT &amp; FULL-STACK ENGINEER</text>

  <!-- Pill Divider -->
  <line x1="250" y1="145" x2="650" y2="145" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Tech Strip -->
  <text x="450" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11.5" fill="#e879f9" text-anchor="middle" letter-spacing="3">PYTHON  •  TYPESCRIPT  •  C#  •  FASTAPI  •  POSTGRESQL  •  DOCKER  •  LINUX</text>
</svg>
