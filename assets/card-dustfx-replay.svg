<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; } 45% { opacity: 0.15; } }
      @keyframes twinkleC { 0%, 100% { opacity: 0.25; } 65% { opacity: 1.00; } }
      @keyframes twinkleD { 0%, 100% { opacity: 0.90; } 55% { opacity: 0.10; } }
      @keyframes twinkleE { 0%, 100% { opacity: 0.20; } 75% { opacity: 0.90; } }
      @keyframes twinkleF { 0%, 100% { opacity: 0.80; } 35% { opacity: 0.20; } }

      .star-a { animation: twinkleA 2.1s infinite ease-in-out 0.0s; }
      .star-b { animation: twinkleB 3.3s infinite ease-in-out 0.5s; }
      .star-c { animation: twinkleC 1.7s infinite ease-in-out 1.1s; }
      .star-d { animation: twinkleD 2.8s infinite ease-in-out 0.3s; }
      .star-e { animation: twinkleE 3.9s infinite ease-in-out 1.5s; }
      .star-f { animation: twinkleF 2.4s infinite ease-in-out 0.8s; }
    </style>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#14062a" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <linearGradient id="fBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="116" rx="14" fill="url(#fBg)" stroke="url(#fBorder)" stroke-width="1.4" />

  <g fill="#ffffff">
    <circle class="star-a" cx="180" cy="30" r="1.1" opacity="0.6" />
    <circle class="star-b" cx="720" cy="80" r="1.4" opacity="0.7" />
  </g>

  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f5d0fe">DustFX &amp; DustReplay — <tspan font-weight="400" font-style="italic" font-size="13.5" fill="#c4b5fd">High-Performance Toolkits</tspan></text>
  
  <text x="30" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#c084fc">DustFX:</text>
  <text x="95" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#f5f3ff">Modular C# framework for high-throughput visual effects processing and runtime performance optimization.</text>

  <text x="30" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#c084fc">DustReplay:</text>
  <text x="115" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#f5f3ff">Python event telemetry parser &amp; automated action replay analysis engine for real-time telemetry processing.</text>
</svg>