<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
        <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; transform: scale(0.85) translate(0, 0); } 50% { opacity: 0.95; transform: scale(1.15) translate(1px, -1px); } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; transform: scale(1.1) translate(0, 0); } 40% { opacity: 0.2; transform: scale(0.75) translate(-1px, 0.8px); } }
      @keyframes twinkleC { 0%, 100% { opacity: 0.3; transform: scale(0.9) translate(0, 0); } 70% { opacity: 1; transform: scale(1.2) translate(0.8px, 1px); } }
      @keyframes twinkleD { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 0.15; transform: scale(0.65); } }
      @keyframes twinkleE { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 60% { opacity: 0.85; transform: scale(1.1); } }
      @keyframes twinkleF { 0%, 100% { opacity: 0.7; transform: scale(1) translate(0, 0); } 30% { opacity: 0.1; transform: scale(0.7) translate(0.5px, -0.5px); } }
      @keyframes nebulaDrift { 0%, 100% { opacity: 0.25; transform: translate(0, 0); } 50% { opacity: 0.45; transform: translate(6px, -4px); } }

      .star-a { animation: twinkleA 3.4s infinite ease-in-out; }
      .star-b { animation: twinkleB 2.6s infinite ease-in-out 0.4s; }
      .star-c { animation: twinkleC 4.2s infinite ease-in-out 1.1s; }
      .star-d { animation: twinkleD 3.0s infinite ease-in-out 1.8s; }
      .star-e { animation: twinkleE 2.1s infinite ease-in-out 0.7s; }
      .star-f { animation: twinkleF 3.8s infinite ease-in-out 2.3s; }
      .nebula { animation: nebulaDrift 10s infinite ease-in-out; }
    </style>
    <linearGradient id="tblBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="50%" stop-color="#140728" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>

    <linearGradient id="tblHeaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
