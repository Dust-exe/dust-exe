<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="100%">
  <defs>
        <style>
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes floatGlow {
        0%, 100% { opacity: 0.25; transform: translate(0, 0); }
        50% { opacity: 0.55; transform: translate(15px, -10px); }
      }
      @keyframes shimmerBorder {
        0% { stop-color: #4c1d95; }
        50% { stop-color: #d946ef; }
        100% { stop-color: #4c1d95; }
      }
      .star1 { animation: starPulse 3s infinite ease-in-out; }
      .star2 { animation: starPulse 2.2s infinite ease-in-out 0.7s; }
      .star3 { animation: starPulse 4s infinite ease-in-out 1.4s; }
      .nebula { animation: floatGlow 8s infinite ease-in-out; }
    </style>
    <linearGradient id="oBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#180733" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <radialGradient id="oNebula" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="oBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="206" rx="14" fill="url(#oBg)" stroke="url(#oBorder)" stroke-width="1.2" />
  <rect class="nebula" x="2" y="2" width="896" height="206" rx="14" fill="url(#oNebula)" />

  <g fill="#ffffff">
    <circle class="star2" cx="80" cy="50" r="1.2" />
    <circle class="star1" cx="320" cy="170" r="1.5" />
    <circle class="star3" cx="820" cy="40" r="1" />
  </g>

  <!-- Title Header -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#f5d0fe">OST Studio - <tspan font-weight="400" font-style="italic" font-size="14" fill="#c4b5fd">Flagship Distributed Ecosystem (oststudio.net)</tspan></text>
  <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#e9d5ff">End-to-end multi-tenant platform unifying Discord services, full-stack admin panels, and real-time XP telemetry.</text>

  <!-- Tech Stack Grid -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="410" height="42" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.4" />
    <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Frontend:</text>
    <text x="85" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">React 18, TypeScript, Vite, TailwindCSS, Framer Motion</text>

    <rect x="430" y="0" width="410" height="42" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.4" />
    <text x="444" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Backend &amp; API:</text>
    <text x="538" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">FastAPI, Async SQLAlchemy, OAuth2 Session Mgmt</text>

    <rect x="0" y="52" width="410" height="42" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.4" />
    <text x="14" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Data Mgmt:</text>
    <text x="95" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">PostgreSQL + Alembic migrations, SQLite WAL edge</text>

    <rect x="430" y="52" width="410" height="42" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.4" />
    <text x="444" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">DevOps &amp; Infra:</text>
    <text x="548" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">Docker Compose, Linux VDS, Nginx, GitHub Actions</text>
  </g>
</svg>