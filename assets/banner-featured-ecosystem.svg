<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.15); } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; transform: scale(1.1); } 40% { opacity: 0.2; transform: scale(0.75); } }

      .star-a { animation: twinkleA 3.4s infinite ease-in-out; }
      .star-b { animation: twinkleB 2.6s infinite ease-in-out 0.4s; }
    </style>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060210" />
      <stop offset="35%" stop-color="#15072d" />
      <stop offset="50%" stop-color="#24063c" />
      <stop offset="65%" stop-color="#15072d" />
      <stop offset="100%" stop-color="#060210" />
    </linearGradient>
    <linearGradient id="gBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="44" rx="10" fill="url(#gBg)" stroke="url(#gBorder)" stroke-width="1.2" />
  
  <g fill="#ffffff">
    <circle class="star-a" cx="120" cy="20" r="1.1" opacity="0.6" />
    <circle class="star-b" cx="780" cy="25" r="1.4" opacity="0.7" />
  </g>

  <text x="450" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="url(#gText)" text-anchor="middle" letter-spacing="3.5">ENTERPRISE ECOSYSTEM ARCHITECTURE — CASE STUDY</text>
</svg>