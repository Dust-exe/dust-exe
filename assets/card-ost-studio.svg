<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <style>
      @keyframes twinkleA { 0%, 100% { opacity: 0.15; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.15); } }
      @keyframes twinkleB { 0%, 100% { opacity: 0.85; transform: scale(1.1); } 40% { opacity: 0.2; transform: scale(0.75); } }
      @keyframes nebulaDrift { 0%, 100% { opacity: 0.25; transform: translate(0, 0); } 50% { opacity: 0.45; transform: translate(6px, -4px); } }

      .star-a { animation: twinkleA 3.4s infinite ease-in-out; }
      .star-b { animation: twinkleB 2.6s infinite ease-in-out 0.4s; }
      .nebula { animation: nebulaDrift 10s infinite ease-in-out; }
    </style>
    <linearGradient id="oBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="50%" stop-color="#180733" />
      <stop offset="100%" stop-color="#060212" />
    </linearGradient>
    <radialGradient id="oNebula" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="oBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#oBg)" stroke="url(#oBorder)" stroke-width="1.4" />
  <rect class="nebula" x="2" y="2" width="896" height="216" rx="14" fill="url(#oNebula)" />

  <g fill="#ffffff">
    <circle class="star-a" cx="150" cy="40" r="1.1" opacity="0.6" />
    <circle class="star-b" cx="780" cy="180" r="1.4" opacity="0.7" />
  </g>

  <!-- Header Title -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#f5d0fe">Enterprise Microservices Architecture — <tspan font-weight="600" font-size="14" fill="#c4b5fd">Multi-Tenant Platform Case Study</tspan></text>
  <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#e9d5ff">High-availability multi-tenant ecosystem unifying microservices, OAuth2 session security, and real-time event telemetry.</text>

  <!-- Tech Stack Grid Cards -->
  <g transform="translate(30, 78)">
    <!-- Card 1: Frontend -->
    <rect x="0" y="0" width="410" height="46" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.5" />
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Frontend &amp; UX Engine:</text>
    <text x="150" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">React 18, TypeScript, Vite, TailwindCSS</text>
    <text x="14" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#a78bfa">Framer Motion dynamic animations, responsive SPA design</text>

    <!-- Card 2: Backend -->
    <rect x="430" y="0" width="410" height="46" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.5" />
    <text x="444" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Backend &amp; API Microservices:</text>
    <text x="616" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">FastAPI, Python, REST</text>
    <text x="444" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#a78bfa">Async SQLAlchemy, Pydantic validation, OAuth2 JWT auth</text>

    <!-- Card 3: Storage -->
    <rect x="0" y="58" width="410" height="46" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.5" />
    <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">Data Persistence &amp; Caching:</text>
    <text x="175" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">PostgreSQL + Alembic, Redis</text>
    <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#a78bfa">SQLite WAL mode edge telemetry storage, migration scripts</text>

    <!-- Card 4: DevOps -->
    <rect x="430" y="58" width="410" height="46" rx="8" fill="#1e0b38" stroke="#7c3aed" stroke-opacity="0.5" />
    <text x="444" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c084fc">DevOps &amp; Infrastructure:</text>
    <text x="596" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#f5f3ff">Docker Compose, Linux VDS</text>
    <text x="444" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#a78bfa">Nginx reverse proxy, SSL termination, systemd supervision</text>
  </g>
</svg>