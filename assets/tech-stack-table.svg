<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="tblBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="50%" stop-color="#140728" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>

    <linearGradient id="tblHeaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e0b38" />
      <stop offset="50%" stop-color="#2d0a4e" />
      <stop offset="100%" stop-color="#1e0b38" />
    </linearGradient>

    <linearGradient id="tblBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <!-- Outer Glass Frame -->
  <rect x="2" y="2" width="896" height="286" rx="14" fill="url(#tblBg)" stroke="url(#tblBorder)" stroke-width="1.5" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="40" cy="30" r="1" />
    <circle cx="180" cy="180" r="1.2" />
    <circle cx="340" cy="90" r="0.8" />
    <circle cx="720" cy="220" r="1" />
    <circle cx="850" cy="80" r="1.2" />
    <circle cx="620" cy="40" r="0.8" />
  </g>

  <!-- Header Row -->
  <path d="M 2 16 A 14 14 0 0 1 16 2 L 884 2 A 14 14 0 0 1 898 16 L 898 46 L 2 46 Z" fill="url(#tblHeaderBg)" />
  <line x1="2" y1="46" x2="898" y2="46" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Header Labels -->
  <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#f5d0fe" letter-spacing="1.5">DOMAIN</text>
  <text x="260" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#f5d0fe" letter-spacing="1.5">TECHNOLOGIES &amp; FRAMEWORKS</text>

  <!-- Column Separator Line -->
  <line x1="230" y1="2" x2="230" y2="286" stroke="#a855f7" stroke-width="1" stroke-opacity="0.25" />

  <!-- Row 1: Languages -->
  <line x1="2" y1="94" x2="898" y2="94" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Languages</text>
  <text x="260" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">Python, TypeScript, C#, JavaScript, SQL</text>

  <!-- Row 2: Backend & APIs -->
  <line x1="2" y1="142" x2="898" y2="142" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Backend &amp; APIs</text>
  <text x="260" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">FastAPI, Node.js, Express, Async SQLAlchemy, RESTful APIs, OAuth2</text>

  <!-- Row 3: Data & Persistence -->
  <line x1="2" y1="190" x2="898" y2="190" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Data &amp; Persistence</text>
  <text x="260" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">PostgreSQL, Redis, SQLite (WAL Mode), Alembic Migrations</text>

  <!-- Row 4: Frontend & UI -->
  <line x1="2" y1="238" x2="898" y2="238" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2" />
  <text x="24" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">Frontend &amp; UI</text>
  <text x="260" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">React 18, TypeScript, Vite, TailwindCSS, Framer Motion</text>

  <!-- Row 5: DevOps & Infrastructure -->
  <text x="24" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#c4b5fd">DevOps &amp; Infrastructure</text>
  <text x="260" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13.5" fill="#f5f3ff">Docker, Nginx, Linux Infrastructure, VDS Administration, GitHub Actions, WireGuard</text>
</svg>