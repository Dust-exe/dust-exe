      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

